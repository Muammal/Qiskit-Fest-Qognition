name: ci

on:
  push:
    branches: [main, pre-main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  test:
    runs-on: windows-latest  # Layout tests depend on the fonts the app is designed for.
    timeout-minutes: 40
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-physics.txt -r requirements-dev.txt
      - run: python tools/publish_sim.py check
      - run: python -m pytest -q -m "not slow" --junitxml=results.xml
      - if: failure()
        run: python tools/ci_failures.py results.xml
