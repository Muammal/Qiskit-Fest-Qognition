name: community sims

on:
  pull_request:
    paths: ["community/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy -r requirements-physics.txt
      - name: Every sim file is safe to open and the list is up to date
        run: python tools/publish_sim.py check
