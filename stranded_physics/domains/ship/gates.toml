# One [[gate]] per check. Targets are from the 1912 British inquiry, and were committed before any ship model existed.
# They are blind to the result, but not to the target: the author knows how the Titanic ended.

[[gate]]
id = "ship.records_and_units"
title = "Ship parameters and dataset records pass unit and split checks"
kind = "verification"
command = "python -c \"from pathlib import Path; from stranded_physics.core.records import load_datasets, load_parameters; p=Path('stranded_physics/domains/ship'); load_datasets(p/'datasets.toml', 'ship'); load_parameters(p/'params.toml')\""
inputs = ["stranded_physics/domains/ship/datasets.toml", "stranded_physics/domains/ship/params.toml"]
required = true

[[gate]]
id = "ship-model"
title = "Flooding rules hold: exact fills, conservation, bulkheads, trim, time rule"
kind = "verification"
command = "python -m pytest stranded_physics/domains/ship/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/ship/*.py", "stranded_physics/domains/ship/*.csv", "stranded_physics/domains/ship/params.toml", "stranded_physics/domains/ship/tests/*.py"]
required = false

[[gate]]
id = "ship-water-at-40-minutes"
title = "Water in the hull 40 minutes after the collision (tons)"
kind = "validation"
scenario = "titanic_1912"
command = "python -m stranded_physics.domains.ship.measure water_at_40_minutes"
inputs = ["stranded_physics/domains/ship/*.py", "stranded_physics/domains/ship/*.csv", "stranded_physics/domains/ship/params.toml"]
required = false
target = 16000.0
tolerance = 3200.0
role = "anchor"
split = "reference"
source = "Wilding, British inquiry, Q20422 area: about 16,000 tons in about 40 minutes. His 12 square feet was worked out from this, so this checks the model against its own input, and is not a prediction"

[[gate]]
id = "ship-foundering-time"
title = "Minutes from collision to foundering"
kind = "validation"
scenario = "titanic_1912"
command = "python -m stranded_physics.domains.ship.measure foundering_minutes"
inputs = ["stranded_physics/domains/ship/*.py", "stranded_physics/domains/ship/*.csv", "stranded_physics/domains/ship/params.toml"]
required = false
target = 160.0
tolerance = 30.0
role = "prediction"
split = "holdout"
source = "Report on the Loss of the Steamship Titanic, British Wreck Commissioner, 1912: 'At 11.40 p. m. on that day she struck an iceberg and at 2.20 a. m. on the next day she foundered'"

[[gate]]
id = "titanic-saved-all"
title = "Share of everyone aboard who were saved"
kind = "validation"
scenario = "titanic_1912"
command = "python -m stranded_physics.validation.titanic saved_all"
inputs = ["stranded_physics/validation/titanic.py", "stranded_physics/runtime/*.py", "stranded_physics/domains/ship/*.py", "stranded_physics/domains/sea/*.py", "stranded_physics/scenario_cards/titanic_1912.toml"]
required = false
target = 0.323
tolerance = 0.1
role = "prediction"
split = "holdout"
source = "Report on the Loss of the Steamship Titanic, British Wreck Commissioner, 1912, Numbers Saved: 711 out of 2,201, or 32.30 per cent"

