# Physical inputs and numerical choices; no holdout calibration.

# Exact time-unit convention for the hourly archive.
[[parameter]]
id = "atmos.seconds_per_hour"
value = 3600.0
unit = "s"
valid_min = 3600.0
valid_max = 3600.0
role = "convention"
status = "assumption"

# Exact km/h to m/s conversion convention.
[[parameter]]
id = "atmos.kmh_per_ms"
value = 3.6
unit = "dimensionless"
valid_min = 3.6
valid_max = 3.6
role = "convention"
status = "assumption"

# Meteorological FROM to transport TOWARD convention, specified in task.
[[parameter]]
id = "atmos.from_to_rotation"
value = 180.0
unit = "degree"
valid_min = 180.0
valid_max = 180.0
role = "convention"
status = "assumption"

# Bearing wrap convention.
[[parameter]]
id = "atmos.full_turn"
value = 360.0
unit = "degree"
valid_min = 360.0
valid_max = 360.0
role = "convention"
status = "assumption"
