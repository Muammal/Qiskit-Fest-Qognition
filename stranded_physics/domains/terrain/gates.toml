# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.

[[gate]]
id = "terrain.records_and_units"
title = "Terrain parameters and dataset records pass unit and split checks"
kind = "verification"
command = "python -c \"from pathlib import Path; from stranded_physics.core.records import load_datasets, load_parameters; p=Path('stranded_physics/domains/terrain'); load_datasets(p/'datasets.toml', 'terrain'); load_parameters(p/'params.toml')\""
inputs = ["stranded_physics/domains/terrain/datasets.toml", "stranded_physics/domains/terrain/params.toml"]
required = true
