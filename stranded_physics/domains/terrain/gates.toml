# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.
# Targets were committed before any real raster was downloaded. All three real-data targets are anchors: they test
# that the surface was read and placed correctly, not that any hazard model predicts anything.

[[gate]]
id = "terrain-resampling"
title = "Resampling keeps heights, positions and classes on synthetic rasters"
kind = "verification"
command = "python -m pytest stranded_physics/domains/terrain/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/terrain/*.py", "stranded_physics/domains/terrain/params.toml", "stranded_physics/domains/terrain/tests/*.py"]
required = true

[[gate]]
id = "terrain-summit-height"
title = "Highest land cell matches the catalogued summit height"
kind = "validation"
command = "python -m stranded_physics.domains.terrain.measure summit_height"
inputs = ["stranded_physics/domains/terrain/model.py", "stranded_physics/domains/terrain/measure.py", "stranded_physics/domains/terrain/params.toml", "stranded_physics/domains/terrain/datasets.toml"]
required = false
target = 1220.0  # metres
tolerance = 100.0  # Allows for averaging a narrow crater rim into 90 m cells, and for the catalogue's rounding.
role = "anchor"
split = "reference"
source = "Smithsonian GVP volcano 360150, elevation_m in disaster_data/catalog/volcanoes.csv"

[[gate]]
id = "terrain-summit-location"
title = "Highest land cell lies near the catalogued summit position"
kind = "validation"
command = "python -m stranded_physics.domains.terrain.measure summit_location"
inputs = ["stranded_physics/domains/terrain/model.py", "stranded_physics/domains/terrain/measure.py", "stranded_physics/domains/terrain/params.toml", "stranded_physics/domains/terrain/datasets.toml"]
required = false
target = 0.0  # metres from the catalogued position
tolerance = 1500.0  # The catalogue gives two decimal places, about 1.1 km, and the crater is itself about 1.6 km wide.
role = "anchor"
split = "reference"
source = "Smithsonian GVP volcano 360150, latitude and longitude in disaster_data/catalog/volcanoes.csv"

[[gate]]
id = "terrain-island-area"
title = "Land area matches an independent coastline"
kind = "validation"
command = "python -m stranded_physics.domains.terrain.measure island_area"
inputs = ["stranded_physics/domains/terrain/model.py", "stranded_physics/domains/terrain/measure.py", "stranded_physics/domains/terrain/params.toml", "stranded_physics/domains/terrain/datasets.toml"]
required = false
target = 330.75  # square kilometres
tolerance = 25.0  # About 7.5%, for coastline generalisation in a 10 m scale vector dataset.
role = "anchor"
split = "reference"
source = "island_area_km2 for volcano 360150 in disaster_data/catalog/volcanoes.csv, computed from Natural Earth 10 m land"

[[gate]]
id = "terrain-canopy-bias"
title = "Canopy bias on valley floors, GLO-30 minus FABDEM (reported, no target)"
kind = "validation"
command = "python -m stranded_physics.domains.terrain.measure canopy"
inputs = ["stranded_physics/domains/terrain/model.py", "stranded_physics/domains/terrain/measure.py", "stranded_physics/domains/terrain/params.toml", "stranded_physics/domains/terrain/datasets.toml"]
required = false
expect = "NO_TARGET"
role = "input"
split = "reference"
source = "FABDEM V1-2 is a machine-learned bare-earth estimate, so it cannot give a pass or fail here"
