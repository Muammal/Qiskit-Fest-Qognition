# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.

[[gate]]
id = "lahar-model"
title = "LAHARZ scaling, channel confinement and rain-on-ash trigger hold on test terrain"
kind = "verification"
command = "python -m pytest stranded_physics/domains/lahar/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/lahar/*.py", "stranded_physics/domains/lahar/params.toml", "stranded_physics/domains/lahar/tests/*.py"]
required = true

[[gate]]
id = "lahar-trigger-timing"
title = "Frames with a lahar in the St Vincent run (reported, no target)"
kind = "validation"
scenario = "st_vincent_2021"
command = "python -m stranded_physics.validation.st_vincent_flows lahar_frames"
inputs = ["stranded_physics/domains/lahar/*.py", "stranded_physics/domains/lahar/params.toml", "stranded_physics/validation/st_vincent_flows.py"]
required = false
expect = "NO_TARGET"
role = "prediction"
split = "reference"
source = "No dated local rain gauge or lahar record is held yet. The rain source is one coarse grid cell, so it cannot judge trigger timing."

[[gate]]
id = "lahar.records_and_units"
title = "Lahar parameters and dataset records pass unit and split checks"
kind = "verification"
command = "python -c \"from pathlib import Path; from stranded_physics.core.records import load_datasets, load_parameters; p=Path('stranded_physics/domains/lahar'); load_datasets(p/'datasets.toml', 'lahar'); load_parameters(p/'params.toml')\""
inputs = ["stranded_physics/domains/lahar/datasets.toml", "stranded_physics/domains/lahar/params.toml"]
required = true
