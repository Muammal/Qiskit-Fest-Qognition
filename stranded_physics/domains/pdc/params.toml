# pdc T1 settings, fixed before the model first ran on St Vincent. Do not tune these against the holdout gates.

[[parameter]]
id = "pdc.height_over_length"  # Middle of the 0.1 to 0.3 usually quoted for column-collapse flows. From memory, so check against Tierz et al. 2016 in T-104.
value = 0.2
unit = "dimensionless"
valid_min = 0.05
valid_max = 0.5
role = "input"
status = "assumption"

[[parameter]]
id = "pdc.collapse_height"  # Middle of the 500 to 1500 m often used for energy cones. From memory, so check in T-104.
value = 1000.0
unit = "m"
valid_min = 100.0
valid_max = 3000.0
role = "input"
status = "assumption"

[[parameter]]
id = "pdc.valley_confinement"  # Dense flows stay within this height of the valley floor. Far above the 20 m deposits Cole et al. report, to allow for flow depth and climbing.
value = 40.0
unit = "m"
valid_min = 5.0
valid_max = 300.0
role = "input"
status = "assumption"

[[parameter]]
id = "pdc.proximal_radius"  # Flows spread freely this close to the vent: about the crater, reported as 1.6 km wide, plus a margin.
value = 1500.0
unit = "m"
valid_min = 500.0
valid_max = 5000.0
role = "input"
status = "assumption"

[[parameter]]
id = "pdc.min_speed"  # Stops travel time blowing up where the energy line nears the ground. Sets arrival times only, not reach.
value = 5.0
unit = "m/s"
valid_min = 0.5
valid_max = 30.0
role = "convention"
status = "assumption"

[[parameter]]
id = "pdc.first_collapse_after_axis_start"  # 21:30 UTC on 10 April, counted from 00:00 UTC on 8 April.
value = 69.5
unit = "hour"
valid_min = 0.0
valid_max = 200.0
role = "input"
status = "literature"
source = "Cole et al., accepted manuscript of Geological Society Special Publication 539 (raw/st_vincent_cole_accepted.pdf): 'onset of the first significant PDC activity was associated with U3 activity from 21:30 UTC on 10th April'"
