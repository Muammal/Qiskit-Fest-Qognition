# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.
# Holdout targets come from Cole et al., accepted manuscript of Geological Society Special Publication 539. They were committed
# before the flow model was written or run. A FAIL here is a real result about a simple model, and is not to be tuned away.

[[gate]]
id = "pdc-model"
title = "Energy line, barriers, arrival order and time rules hold on test terrain"
kind = "verification"
command = "python -m pytest stranded_physics/domains/pdc/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/pdc/*.py", "stranded_physics/domains/pdc/params.toml", "stranded_physics/domains/pdc/tests/*.py"]
required = true

[[gate]]
id = "pdc-reaches-west-sea"
title = "Dense flows reach the sea on the west flank"
kind = "validation"
command = "python -m stranded_physics.validation.st_vincent_flows west_sea"
inputs = ["stranded_physics/domains/pdc/*.py", "stranded_physics/domains/pdc/params.toml", "stranded_physics/domains/terrain/*.py", "stranded_physics/validation/st_vincent_flows.py"]
required = false
target = 1.0  # 1 when any flow cell touches the sea on bearings 225 to 315 degrees from the vent.
tolerance = 0.0
role = "prediction"
split = "holdout"
source = "Cole et al.: 'Dense PDCs reached the sea only in the Larikai and Roseau Valleys', on the West flank"

[[gate]]
id = "pdc-sea-only-on-west"
title = "Share of flow cells touching the sea that lie off the west flank"
kind = "validation"
command = "python -m stranded_physics.validation.st_vincent_flows sea_off_west"
inputs = ["stranded_physics/domains/pdc/*.py", "stranded_physics/domains/pdc/params.toml", "stranded_physics/domains/terrain/*.py", "stranded_physics/validation/st_vincent_flows.py"]
required = false
target = 0.0
tolerance = 0.1
role = "prediction"
split = "holdout"
source = "Cole et al.: 'Dense PDCs reached the sea only in the Larikai and Roseau Valleys', on the West flank"

[[gate]]
id = "pdc-southeast-reach"
title = "Flows on the southeast flank stop near the crater"
kind = "validation"
command = "python -m stranded_physics.validation.st_vincent_flows southeast_reach_km"
inputs = ["stranded_physics/domains/pdc/*.py", "stranded_physics/domains/pdc/params.toml", "stranded_physics/domains/terrain/*.py", "stranded_physics/validation/st_vincent_flows.py"]
required = false
target = 1.8  # Kilometres from the vent on bearings 112 to 157 degrees: about 1 km past a rim about 0.8 km out.
tolerance = 1.0
role = "prediction"
split = "holdout"
source = "Cole et al.: PDCs 'extended short distances (approximately 1 km) down valleys to the southeast'"

[[gate]]
id = "pdc-first-flow-time"
title = "First flow starts at the published time"
kind = "verification"
command = "python -m stranded_physics.validation.st_vincent_flows first_flow_h"
inputs = ["stranded_physics/domains/pdc/*.py", "stranded_physics/domains/pdc/params.toml", "stranded_physics/validation/st_vincent_flows.py"]
required = false
target = 69.5  # Hours after 8 April 00:00 UTC, which is 21:30 UTC on 10 April. An input, so this only checks it was read correctly.
tolerance = 0.5
role = "input"
split = "reference"
source = "Cole et al.: 'onset of the first significant PDC activity was associated with U3 activity from 21:30 UTC on 10th April'"
