# Event inputs and assumptions; source times are not predictions.

# Cited from memory; task supplies H_km = 2 V^0.241; original paper unavailable offline.
[[parameter]]
id = "eruption.mastin_coefficient"
value = 2.0
unit = "dimensionless"
valid_min = 2.0
valid_max = 2.0
role = "input"
status = "literature"
source = "https://doi.org/10.1016/j.jvolgeores.2009.01.008 ; height versus DRE volume-rate relation"

# Cited from memory; task-specified Mastin exponent.
[[parameter]]
id = "eruption.mastin_exponent"
value = 0.241
unit = "dimensionless"
valid_min = 0.241
valid_max = 0.241
role = "input"
status = "literature"
source = "https://doi.org/10.1016/j.jvolgeores.2009.01.008 ; height versus DRE volume-rate relation"

# Task-specified dense-rock density; mass is directly proportional to this choice.
[[parameter]]
id = "eruption.dre_density"
value = 2500.0
unit = "kg/m**3"
valid_min = 2500.0
valid_max = 2500.0
role = "convention"
status = "assumption"

# Cited from memory; task-specified stratified-plume coefficient.
[[parameter]]
id = "eruption.mtt_coefficient"
value = 5.0
unit = "dimensionless"
valid_min = 5.0
valid_max = 5.0
role = "input"
status = "literature"
source = "https://doi.org/10.1098/rspa.1956.0011 ; stratified buoyant plume maximum height"

# Cited from memory; task-specified plume scaling.
[[parameter]]
id = "eruption.mtt_flux_power"
value = 0.25
unit = "dimensionless"
valid_min = 0.25
valid_max = 0.25
role = "input"
status = "literature"
source = "https://doi.org/10.1098/rspa.1956.0011 ; stratified buoyant plume maximum height"

# Cited from memory; task-specified plume scaling.
[[parameter]]
id = "eruption.mtt_frequency_power"
value = -0.75
unit = "dimensionless"
valid_min = -0.75
valid_max = -0.75
role = "input"
status = "literature"
source = "https://doi.org/10.1098/rspa.1956.0011 ; stratified buoyant plume maximum height"

# Exact unit convention.
[[parameter]]
id = "eruption.metres_per_km"
value = 1000.0
unit = "dimensionless"
valid_min = 1000.0
valid_max = 1000.0
role = "convention"
status = "assumption"

# Date-only 8 April tremor/gas in IPGP, placed at noon UTC as requested.
[[parameter]]
id = "eruption.escalation_epoch"
value = 1617883200.0
unit = "s"
valid_min = 1617883200.0
valid_max = 1617883200.0
role = "convention"
status = "assumption"

# No quantitative detection probability supplied; independent Bernoulli draws per run-up frame.
[[parameter]]
id = "eruption.tremor_probability"
value = 0.5
unit = "dimensionless"
valid_min = 0.5
valid_max = 0.5
role = "convention"
status = "assumption"

# No quantitative detection probability supplied; independent Bernoulli draws per run-up frame.
[[parameter]]
id = "eruption.gas_probability"
value = 0.5
unit = "dimensionless"
valid_min = 0.5
valid_max = 0.5
role = "convention"
status = "assumption"

# Above-vent column surrogate for events lacking height; strong mass and transport sensitivity, not fitted.
[[parameter]]
id = "eruption.default_height"
value = 12000.0
unit = "m"
valid_min = 12000.0
valid_max = 12000.0
role = "convention"
status = "assumption"

# IPGP reports about 8 km without an explicit datum; treated as above vent, not an altitude conversion.
[[parameter]]
id = "eruption.first_height"
value = 8000.0
unit = "m"
valid_min = 8000.0
valid_max = 8000.0
role = "convention"
status = "assumption"

# Half-hour column activity for unresolved pulses; RSAM spike lengths are not plume-emission durations.
[[parameter]]
id = "eruption.default_duration"
value = 1800.0
unit = "s"
valid_min = 1800.0
valid_max = 1800.0
role = "convention"
status = "assumption"

# Taylor section 3.1 gives 4.3-4.8 h visible plume duration; lower end applied from seismic onset as a column proxy.
[[parameter]]
id = "eruption.first_duration"
value = 15480.0
unit = "s"
valid_min = 15480.0
valid_max = 15480.0
role = "convention"
status = "assumption"

