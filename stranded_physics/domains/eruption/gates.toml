# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.
# Column heights and event times are inputs, so they stay unscored. Nothing here validates a prediction.

[[gate]]
id = "eruption-model"
title = "Timeline, seed and time rules hold on test data"
kind = "verification"
command = "python -m pytest stranded_physics/domains/eruption/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv", "stranded_physics/domains/eruption/tests/*.py"]
required = false

[[gate]]
id = "eruption-total-mass"
title = "Modelled mass up to 12 April beside the published whole-eruption fallout (reported, no target)"
kind = "validation"
scenario = "st_vincent_2021"
command = "python -m stranded_physics.domains.eruption.measure total_mass"
inputs = ["stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv"]
required = false
expect = "NO_TARGET"
role = "prediction"
split = "reference"
source = "Cole et al.: fallout 35.5 x 10^6 m3 DRE, so 8.9 x 10^10 kg at 2500 kg/m3, for the whole eruption to 22 April. The model stops at 12 April, so the two can't be scored against each other."

[[gate]]
id = "eruption-plume-scaling"
title = "Column height rises with mass rate close to Morton-Taylor-Turner's one-quarter power"
kind = "verification"
command = "python -m stranded_physics.domains.eruption.measure mastin_slope"
inputs = ["stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml"]
required = false
target = 0.25
tolerance = 0.02
role = "anchor"
split = "reference"
source = "Morton, Taylor and Turner 1956, buoyant plume in a stratified fluid. Cited from memory; check the locator in T-104."
