# One [[gate]] per check: id, title, kind, command, inputs, required, then target and tolerance, or rate_low and rate_high.
# The two holdout targets were committed before any ash model existed. A FAIL here is a real result, not a bug to tune away.

[[gate]]
id = "tephra-model"
title = "Settling, Gaussian transport, release and wind rules hold on test data"
kind = "verification"
command = "python -m pytest stranded_physics/domains/tephra/tests -q -p no:cacheprovider"
inputs = ["stranded_physics/domains/tephra/*.py", "stranded_physics/domains/tephra/params.toml", "stranded_physics/domains/tephra/tests/*.py"]
required = false

[[gate]]
id = "tephra-mass-balance"
title = "Released ash mass matches the mass that lands"
kind = "verification"
command = "python -m stranded_physics.validation.st_vincent_ash mass_balance"
inputs = ["stranded_physics/domains/tephra/*.py", "stranded_physics/domains/tephra/params.toml", "stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv", "stranded_physics/domains/atmos/*.py", "stranded_physics/validation/*.py"]
required = false
target = 0.0
tolerance = 0.02
role = "anchor"
split = "reference"
source = "Conservation of mass"

[[gate]]
id = "tephra-grain-convergence"
title = "Island ash barely changes when the number of grain sizes doubles"
kind = "verification"
command = "python -m stranded_physics.validation.st_vincent_ash grain_convergence"
inputs = ["stranded_physics/domains/tephra/*.py", "stranded_physics/domains/tephra/params.toml", "stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv", "stranded_physics/domains/atmos/*.py", "stranded_physics/validation/*.py"]
required = false
target = 0.0
tolerance = 0.1
role = "anchor"
split = "reference"
source = "Numerical convergence: mean land load changes by under 10% when grain classes double"

[[gate]]
id = "tephra-barbados-first-ash"
title = "Ash first reaches Barbados on 10 April 2021"
kind = "validation"
scenario = "st_vincent_2021"
command = "python -m stranded_physics.validation.st_vincent_ash barbados_first_ash_h"
inputs = ["stranded_physics/domains/tephra/*.py", "stranded_physics/domains/tephra/params.toml", "stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv", "stranded_physics/domains/atmos/*.py", "stranded_physics/validation/*.py"]
required = false
target = 60.0  # Hours after 8 April 00:00 UTC: midday on 10 April.
tolerance = 12.0  # The source gives only the date.
role = "prediction"
split = "holdout"
source = "'ce qui va impacter l'ile de la Barbade des le 10 avril', st_vincent_ipgp in disaster_data/case_studies.json"

[[gate]]
id = "tephra-island-cover"
title = "All of St Vincent has ash by the end of 10 April 2021"
kind = "validation"
scenario = "st_vincent_2021"
command = "python -m stranded_physics.validation.st_vincent_ash island_cover"
inputs = ["stranded_physics/domains/tephra/*.py", "stranded_physics/domains/tephra/params.toml", "stranded_physics/domains/eruption/*.py", "stranded_physics/domains/eruption/params.toml", "stranded_physics/domains/eruption/facts.csv", "stranded_physics/domains/atmos/*.py", "stranded_physics/validation/*.py"]
required = false
target = 1.0  # Share of land cells with at least 0.01 kg/m2, about 10 micrometres of ash.
tolerance = 0.05
role = "prediction"
split = "holdout"
source = "'Des le 11 avril, toute l'ile de Saint-Vincent est entierement recouverte', st_vincent_ipgp in disaster_data/case_studies.json. The threshold is an assumption."
