# Uncalibrated T1 transport assumptions and numerical conventions.

# Standard gravity convention; spatial variation neglected.
[[parameter]]
id = "tephra.gravity"
value = 9.80665
unit = "m/s**2"
valid_min = 9.80665
valid_max = 9.80665
role = "convention"
status = "assumption"

# Constant dense spherical particle approximation; buoyancy and terminal speed depend on density contrast.
[[parameter]]
id = "tephra.particle_density"
value = 2500.0
unit = "kg/m**3"
valid_min = 500
valid_max = 3000
role = "input"
status = "assumption"

# Constant near-surface air density throughout descent; altitude dependence neglected.
[[parameter]]
id = "tephra.air_density"
value = 1.2
unit = "kg/m**3"
valid_min = 0.1
valid_max = 1.5
role = "input"
status = "assumption"

# Constant air viscosity; temperature dependence neglected.
[[parameter]]
id = "tephra.air_viscosity"
value = 1.8e-05
unit = "Pa*s"
valid_min = 1e-05
valid_max = 3e-05
role = "input"
status = "assumption"

# Task-specified creeping-flow validity bound; reject larger particle Reynolds numbers.
[[parameter]]
id = "tephra.stokes_re_limit"
value = 1.0
unit = "dimensionless"
valid_min = 1.0
valid_max = 1.0
role = "convention"
status = "assumption"

# Surface wind measurement height, specified in task.
[[parameter]]
id = "tephra.wind_height_10m"
value = 10.0
unit = "m"
valid_min = 10.0
valid_max = 10.0
role = "convention"
status = "assumption"

# Fixed 500 hPa geometric height; pressure-height variability neglected.
[[parameter]]
id = "tephra.wind_height_500"
value = 5850.0
unit = "m"
valid_min = 5000
valid_max = 6500
role = "input"
status = "assumption"

# Fixed 200 hPa geometric height; pressure-height variability neglected.
[[parameter]]
id = "tephra.wind_height_200"
value = 12400.0
unit = "m"
valid_min = 10000
valid_max = 14000
role = "input"
status = "assumption"

# Suzuki functional form cited from memory: Suzuki 1983, Arc Volcanism, pp. 95-113.
# Uncalibrated release-shape choice; changes release heights, winds and arrival times.
[[parameter]]
id = "tephra.suzuki_a"
value = 4.0
unit = "dimensionless"
valid_min = 0.1
valid_max = 20
role = "input"
status = "assumption"

# Uncalibrated release-shape choice; controls concentration around the release maximum.
[[parameter]]
id = "tephra.suzuki_lambda"
value = 1.0
unit = "dimensionless"
valid_min = 0.1
valid_max = 10
role = "input"
status = "assumption"

# Equal-height midpoint bins; numerical approximation to a continuous column.
[[parameter]]
id = "tephra.release_bins"
value = 12
unit = "dimensionless"
valid_min = 2
valid_max = 192
role = "convention"
status = "assumption"

# Constant isotropic horizontal diffusion; controls spread and point-load tails.
[[parameter]]
id = "tephra.diffusivity"
value = 1000.0
unit = "m**2/s"
valid_min = 10
valid_max = 10000
role = "input"
status = "assumption"

# Wide analytic quadrature domain: six standard deviations around every packet centre.
[[parameter]]
id = "tephra.budget_sigma"
value = 6.0
unit = "dimensionless"
valid_min = 4
valid_max = 10
role = "convention"
status = "assumption"

# Quadrature points per dimension for independent Gaussian mass integration.
[[parameter]]
id = "tephra.budget_points"
value = 241
unit = "dimensionless"
valid_min = 41
valid_max = 1001
role = "convention"
status = "assumption"

# Requested first-arrival detection threshold, not a measured sensitivity.
[[parameter]]
id = "tephra.barbados_threshold"
value = 0.001
unit = "kg/m**2"
valid_min = 0.001
valid_max = 0.001
role = "convention"
status = "assumption"

# Requested island-cover load threshold, not a measured isopach.
[[parameter]]
id = "tephra.island_threshold"
value = 0.01
unit = "kg/m**2"
valid_min = 0.01
valid_max = 0.01
role = "convention"
status = "assumption"

# Requested reproducibility seed; ash itself is deterministic.
[[parameter]]
id = "tephra.validation_seed"
value = 1
unit = "dimensionless"
valid_min = 1
valid_max = 1
role = "convention"
status = "assumption"

# Selected before holdout runs: 64 to 128 grains changed final mean land load by 6.6665e-5 relative.
[[parameter]]
id = "tephra.grain_count"
value = 64
unit = "dimensionless"
valid_min = 2
valid_max = 4096
role = "convention"
status = "assumption"

# Task-specified lower phi bound (16 mm); the spectrum is truncated.
[[parameter]]
id = "tephra.grain_phi_min"
value = -4.0
unit = "dimensionless"
valid_min = -4.0
valid_max = -4.0
role = "convention"
status = "assumption"

# Task-specified upper phi bound (15.625 micrometres).
[[parameter]]
id = "tephra.grain_phi_max"
value = 6.0
unit = "dimensionless"
valid_min = 6.0
valid_max = 6.0
role = "convention"
status = "assumption"

# Round trial median, not a measured eruption-wide distribution. Cole section 3/Fig 6 reports unit-dependent grains and aggregation peaks at 1 phi, not this normal law.
[[parameter]]
id = "tephra.grain_median_phi"
value = 1.0
unit = "dimensionless"
valid_min = -3.0
valid_max = 5.0
role = "input"
status = "assumption"

# Round trial standard deviation in phi; Cole section 3 supplies no eruption-wide normal spread. Controls distal mass fraction.
[[parameter]]
id = "tephra.grain_spread_phi"
value = 2.0
unit = "dimensionless"
valid_min = 0.5
valid_max = 4.0
role = "input"
status = "assumption"

# Task-specified Schiller-Naumann drag correction; cited from memory, Schiller and Naumann 1933, VDI 77 pp. 318-320, not read offline.
[[parameter]]
id = "tephra.drag_coefficient"
value = 0.15
unit = "dimensionless"
valid_min = 0.15
valid_max = 0.15
role = "convention"
status = "assumption"

# Task-specified Schiller-Naumann Reynolds exponent; cited from memory as above.
[[parameter]]
id = "tephra.drag_exponent"
value = 0.687
unit = "dimensionless"
valid_min = 0.687
valid_max = 0.687
role = "convention"
status = "assumption"

# Task-specified transition to constant sphere drag; rounded branches have a small jump.
[[parameter]]
id = "tephra.drag_transition_re"
value = 1000.0
unit = "dimensionless"
valid_min = 1000.0
valid_max = 1000.0
role = "convention"
status = "assumption"

# Task-specified high-Re sphere drag; cited from memory as above.
[[parameter]]
id = "tephra.newton_drag"
value = 0.44
unit = "dimensionless"
valid_min = 0.44
valid_max = 0.44
role = "convention"
status = "assumption"

# Absolute root tolerance in Reynolds number; negligible compared with drag-law uncertainty.
[[parameter]]
id = "tephra.settling_tolerance"
value = 1e-12
unit = "dimensionless"
valid_min = 1e-14
valid_max = 1e-08
role = "convention"
status = "assumption"
