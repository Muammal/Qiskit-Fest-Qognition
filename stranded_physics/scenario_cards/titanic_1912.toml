# RMS Titanic, 14 to 15 April 1912. Who was aboard and the damage are from the British inquiry. Where people start, how long they take to reach the boat deck, and how the crew filled boats are assumptions.
# Ship time is taken as UTC-3 (assumption: about right for that position). The scenario starts ten minutes before the collision at 11.40 p.m. and ends about when the Carpathia reached the boats.
id = "titanic_1912"
title = "RMS Titanic, April 1912"
place = "real"
start_utc = "1912-04-15T02:30:00+00:00"
hours = 5
step_minutes = 10
