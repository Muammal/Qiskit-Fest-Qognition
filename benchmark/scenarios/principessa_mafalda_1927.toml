# Elinder and Erixson 2012, PNAS 109(33):13220, Table 1: aboard, women share, duration, order.
# assumption: breach flooding proxy; no list, capsize or mechanical-failure dynamics.
# assumption: Titanic geometry scaled by cube root of aboard / Titanic headcount;
# equal compartments and a representative bulkhead height replace its uneven layout.
# assumption: Titanic crew share and passenger child share, rounded; no class split.
# assumption: Titanic cohort positions, reach times and deck-crew boat assignment.
# assumption: boat count scales with aboard; mean seats and launch window follow Titanic.
# Breach area matches the sinking-time input to this record, not tuning to survival.
# Source discrepancy: clock subtraction is 295 minutes; prose says about four hours and twenty minutes.
# sink_minutes = 295
# https://en.wikipedia.org/wiki/SS_Principessa_Mafalda: "17:15; sank at 22:10"; recorded elapsed time.
