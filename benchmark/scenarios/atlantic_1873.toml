# Elinder and Erixson 2012, PNAS 109(33):13220, Table 1: aboard, cause, duration, order and passenger women share.
# Flooding approximation of grounding in North Atlantic, Canada. No shore escape or hull breakup is resolved.
# Geometry scales Titanic dimensions by the cube root of aboard / assumed reference occupancy 2208; displacement scales linearly (assumption).
# Equal compartments and six forward holes approximate Titanic damage (assumption).
# Breach area matches the sinking-time input to this record; this is not tuning to survival.
# Passenger/crew split approximates Titanic proportions using the same assumed reference occupancy, rounded; no children or class split without evidence (assumption).
# Women share applies only to passengers, rounded to whole people; all crew treated as men (assumption).
# Boats scale Titanic count by aboard; seats use rounded Titanic mean, launch fractions use its timeline (assumption).
# Deck ranges and reach delays use Titanic choices; delays scale by chosen sinking time / 160 (assumption).
# All crew are assigned to deck duty for boat manning (assumption).
# sink_minutes = 113.87755102
# assumption, from the paper's quick or slow rule: X = 30 * aboard / 686; use 0.5 X for quick, 3 X for slow.
id = "atlantic_1873" # Elinder and Erixson 2012, Table 1: event identity
title = "atlantic 1873" # Elinder and Erixson 2012, Table 1: event identity
place = "real"
start_utc = "1873-04-01T03:05:00+00:00" # https://en.wikipedia.org/wiki/SS_Atlantic_(1870): date 1873-04-01; recorded local clock minus impact delay
hours = 2.5 # assumption: half-hour horizon extending beyond foundering
step_minutes = 1 # assumption: at least ten steps before and after impact before sinking
local_utc_offset = 0 # assumption: clock is the ship's local time, encoded with zero offset

